# The FastAPI backend only — no private Postgres here. This service shares
# its database with the Omni Helpdesk console (tadiwa-backend): point
# DATABASE_URL in .env at that SAME Postgres instance/`tadiwa` database
# (wherever tadiwa-backend's own DATABASE_URL points), not a database of
# its own. The local LLM is NOT run here either — point LLM_BASE_URL/
# EMBED_BASE_URL in .env at your existing internal OpenAI-compatible endpoint.
#
#   cp .env.example .env   &&   edit .env (DATABASE_URL, LLM_*, EMBED_*)
#   docker compose up -d --build
#   docker compose run --rm backend python ingest.py BSS_steps.md
services:
  # Local embeddings model (your LLM server is chat-only). OpenAI-compatible at
  # http://ollama:11434/v1. After first `up`, pull the model once:
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Uncomment to use a host GPU (otherwise CPU — fine for embeddings):
    # deploy:
    #   resources: { reservations: { devices: [{ capabilities: ["gpu"] }] } }

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    env_file: .env
    ports:
      - "8080:8080"          # front this with nginx/IIS for TLS + SSO in prod
    volumes:
      - ../BSS_steps.md:/app/BSS_steps.md:ro
      - ../dev:/app/dev:ro          # eval harness + gap_report run via `compose run`

volumes:
  ollama:
